<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>全站搜索 - 东软在线医疗云医院</title>
    <script src="js/vue.js"></script>
    <script src="js/axios-0.18.0.js"></script>
    <script src="js/auth-interceptor.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/search.css">
    <script src="component/Header.vue.js"></script>
    <script src="component/Footer.vue.js"></script>
</head>
<body>
<div id="app">
    <header-component :active-nav="''"></header-component>

    <main class="search-page">
        <section class="search-command" aria-labelledby="search-title">
            <div class="search-copy">
                <h1 id="search-title">找到适合你的医疗信息</h1>
                <p>一次检索医院、医生、疾病与健康科普，也可按类型精准筛选。</p>
            </div>
            <form class="search-form" role="search" @submit.prevent="submitSearch">
                <div class="search-input-wrap">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input
                        ref="searchInput"
                        v-model="searchInput"
                        type="search"
                        autocomplete="off"
                        placeholder="输入医院、医生、疾病或文章关键词"
                        aria-label="搜索关键词"
                        @input="handleSuggestionInput"
                        @focus="suggestionOpen = true"
                        @blur="closeSuggestionPanel"
                        @keydown.down.prevent="moveSuggestion(1)"
                        @keydown.up.prevent="moveSuggestion(-1)"
                        @keydown.enter.prevent="handleSuggestionEnter"
                    >
                    <div v-if="suggestionOpen && suggestions.length" class="page-suggestions" @mousedown.prevent>
                        <button
                            v-for="(item, index) in suggestions"
                            :key="item.type + '-' + item.keyword"
                            type="button"
                            :class="{ active: activeSuggestion === index }"
                            @click="selectSuggestion(item)"
                        >
                            <span>{{ item.keyword }}</span>
                            <span>{{ item.typeName }}</span>
                        </button>
                    </div>
                </div>
                <button class="search-submit" type="submit">搜索</button>
            </form>
            <div v-if="hotKeywords.length" class="hot-searches">
                <span>热门搜索</span>
                <button v-for="item in hotKeywords" :key="item" type="button" @click="searchHot(item)">{{ item }}</button>
            </div>
        </section>

        <section v-if="hasSearched" class="result-shell" aria-live="polite">
            <div class="result-heading">
                <div>
                    <span class="result-label">搜索结果</span>
                    <h2>“{{ keyword }}”</h2>
                </div>
                <span v-if="!loading && !errorMessage" class="result-total">共 {{ allTotal }} 条结果</span>
            </div>

            <div class="type-tabs" role="tablist" aria-label="搜索结果类型">
                <button
                    v-for="tab in tabs"
                    :key="tab.key"
                    type="button"
                    role="tab"
                    :aria-selected="activeTab === tab.key ? 'true' : 'false'"
                    :class="{ active: activeTab === tab.key }"
                    @click="switchTab(tab.key)"
                >
                    <span>{{ tab.name }}</span>
                    <strong>{{ pageState[tab.key].total }}</strong>
                </button>
            </div>

            <div v-if="loading" class="state-panel loading-state">
                <span class="loading-ring" aria-hidden="true"></span>
                <p>正在检索相关信息…</p>
            </div>
            <div v-else-if="errorMessage" class="state-panel error-state">
                <h3>暂时无法完成搜索</h3>
                <p>{{ errorMessage }}</p>
                <button type="button" @click="loadOverview">重新搜索</button>
            </div>

            <template v-else>
                <div v-if="activeItems.length" class="result-list">
                    <article v-if="activeTab === 'hospital'" v-for="item in hospitals" :key="item.id" class="result-card hospital-card" @click="goToDetail('hospital', item.id)">
                        <img v-if="item.image" :src="item.image" :alt="item.name">
                        <div v-else class="result-placeholder hospital-placeholder" aria-hidden="true">院</div>
                        <div class="result-content">
                            <div class="result-title-row"><h3>{{ item.name }}</h3><span v-if="item.level" class="result-badge">{{ item.level }}</span></div>
                            <p>{{ item.intro || '查看医院简介、科室与医生信息' }}</p>
                            <div class="result-meta"><span v-if="item.city">{{ item.city }}</span><span v-if="item.address">{{ item.address }}</span></div>
                        </div>
                    </article>

                    <article v-if="activeTab === 'doctor'" v-for="item in doctors" :key="item.id" class="result-card doctor-card" @click="goToDetail('doctor', item.id)">
                        <img v-if="item.avatar" :src="item.avatar" :alt="item.name">
                        <div v-else class="result-placeholder doctor-placeholder" aria-hidden="true">医</div>
                        <div class="result-content">
                            <div class="result-title-row"><h3>{{ item.name }}</h3><span v-if="item.title" class="result-badge">{{ item.title }}</span></div>
                            <p>{{ item.intro || item.expertise || '查看医生介绍与可预约服务' }}</p>
                            <div class="result-meta"><span v-if="item.expertise">擅长：{{ item.expertise }}</span><span v-if="item.onlineStatus === 1" class="online-status">在线</span></div>
                        </div>
                    </article>

                    <article v-if="activeTab === 'disease'" v-for="item in diseases" :key="item.id" class="result-card text-card" @click="goToDetail('disease', item.id)">
                        <div class="result-placeholder disease-placeholder" aria-hidden="true">病</div>
                        <div class="result-content">
                            <div class="result-title-row"><h3>{{ item.name }}</h3><span v-if="item.alias" class="result-badge">{{ item.alias }}</span></div>
                            <p>{{ item.description || item.symptoms || '查看疾病介绍、症状与治疗信息' }}</p>
                            <div v-if="item.symptoms" class="result-meta"><span>常见症状：{{ item.symptoms }}</span></div>
                        </div>
                    </article>

                    <article v-if="activeTab === 'article'" v-for="item in articles" :key="item.id" class="result-card article-card" @click="goToDetail('article', item.id)">
                        <img v-if="item.image" :src="item.image" :alt="item.title">
                        <div v-else class="result-placeholder article-placeholder" aria-hidden="true">文</div>
                        <div class="result-content">
                            <div class="result-title-row"><h3>{{ item.title }}</h3></div>
                            <p>{{ item.summary || '阅读健康科普全文' }}</p>
                            <div class="result-meta"><span v-if="item.author">{{ item.author }}</span><span v-if="item.publishTime">{{ formatDate(item.publishTime) }}</span><span v-if="item.views != null">{{ item.views }} 次阅读</span></div>
                        </div>
                    </article>
                </div>

                <div v-else class="state-panel empty-state">
                    <div class="empty-mark" aria-hidden="true">?</div>
                    <h3>这一分类暂未找到结果</h3>
                    <p>试试缩短关键词，或切换到其他类型查看。</p>
                </div>

                <nav v-if="activePageState.pages > 1" class="pagination" aria-label="搜索结果分页">
                    <button type="button" :disabled="activePageState.pageNum <= 1" @click="changePage(activePageState.pageNum - 1)">上一页</button>
                    <button
                        v-for="page in visiblePages"
                        :key="page"
                        type="button"
                        :class="{ active: page === activePageState.pageNum }"
                        @click="changePage(page)"
                    >{{ page }}</button>
                    <button type="button" :disabled="activePageState.pageNum >= activePageState.pages" @click="changePage(activePageState.pageNum + 1)">下一页</button>
                </nav>
            </template>
        </section>

        <section v-else class="search-guide">
            <div class="guide-symbol" aria-hidden="true">+</div>
            <div>
                <h2>从一个关键词开始</h2>
                <p>可以输入医院名称、医生姓名、疾病症状或健康主题。</p>
            </div>
        </section>
    </main>

    <footer-component></footer-component>
</div>
<script src="js/search-page.js"></script>
</body>
</html>
